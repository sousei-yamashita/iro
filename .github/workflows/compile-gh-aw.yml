name: Compile gh-aw workflows

on:
  workflow_dispatch:
  push:
    branches:
      - line/switch-requirements-review-to-codex-copilot
    paths:
      - ".github/workflows/*.md"
      - ".github/workflows/compile-gh-aw.yml"

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install gh-aw CLI
        uses: github/gh-aw/actions/setup-cli@ff2eccd10a30d6a7bfaf0da449194e907a206555

      - name: Compile Requirements Review
        run: gh aw compile .github/workflows/requirements-review-cost-test.md --strict

      - name: Commit generated lock file
        shell: bash
        run: |
          if git diff --quiet -- .github/workflows/requirements-review-cost-test.lock.yml .github/aw/actions-lock.json; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/requirements-review-cost-test.lock.yml
          if [ -f .github/aw/actions-lock.json ]; then
            git add .github/aw/actions-lock.json
          fi
          git commit -m "Compile Requirements Review workflow"
          git push
