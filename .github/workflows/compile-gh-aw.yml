name: Compile gh-aw workflows

on:
  workflow_dispatch:
  push:
    branches:
      - line/switch-requirements-review-to-codex-copilot
    paths:
      - ".github/workflows/*.md"
      - ".github/workflows/compile-gh-aw.yml"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install gh-aw CLI
        uses: github/gh-aw/actions/setup-cli@ff2eccd10a30d6a7bfaf0da449194e907a206555

      - name: Compile Requirements Review
        run: gh aw compile .github/workflows/requirements-review-cost-test.md --strict

      - name: Export generated files
        shell: bash
        run: |
          echo "LOCK_B64_BEGIN"
          base64 -w0 .github/workflows/requirements-review-cost-test.lock.yml
          echo
          echo "LOCK_B64_END"
          if [ -f .github/aw/actions-lock.json ]; then
            echo "ACTIONS_LOCK_B64_BEGIN"
            base64 -w0 .github/aw/actions-lock.json
            echo
            echo "ACTIONS_LOCK_B64_END"
          fi
