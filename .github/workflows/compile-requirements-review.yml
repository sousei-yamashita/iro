name: Compile Requirements Review
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/requirements-review-cost-test.md'
      - '.github/workflows/compile-requirements-review.yml'
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install gh-aw
        run: gh extension install github/gh-aw
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Compile
        run: gh aw compile requirements-review-cost-test
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Stage compiled lock for retrieval
        run: |
          base64 -w0 .github/workflows/requirements-review-cost-test.lock.yml > compiled-review-lock.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add compiled-review-lock.txt
          git commit -m "Stage compiled review lock"
          git push origin HEAD:line/install-requirements-review
