name: CI evidence

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  record:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve exact pull request identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/actions/runs/$RUN_ID")"

          pr_number="$(printf '%s' "$run_json" | python -c 'import json,sys; data=json.load(sys.stdin); prs=data.get("pull_requests", []); print(prs[0]["number"] if len(prs) == 1 else "")')"
          test -n "$pr_number"

          pr_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/pulls/$pr_number")"
          current_head="$(printf '%s' "$pr_json" | python -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])')"

          if [ "$current_head" != "$HEAD_SHA" ]; then
            echo "STALE: CI subject is no longer the current PR head."
            exit 1
          fi

          {
            echo "pr_number=$pr_number"
            echo "head_sha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Write CI evidence
        env:
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.identity.outputs.pr_number }}
          HEAD_SHA: ${{ steps.identity.outputs.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CREATED_AT: ${{ github.event.workflow_run.updated_at }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os

          evidence = {
              "schema": "sousei.line-evidence/v1",
              "repository": os.environ["REPOSITORY"],
              "pr_number": int(os.environ["PR_NUMBER"]),
              "subject_head_sha": os.environ["HEAD_SHA"],
              "stage": "ci",
              "verdict": "PASS",
              "evidence": {
                  "workflow": "CI",
                  "run_id": int(os.environ["RUN_ID"]),
                  "run_attempt": int(os.environ["RUN_ATTEMPT"]),
                  "conclusion": os.environ["CONCLUSION"],
              },
              "issued_at": os.environ["CREATED_AT"],
          }

          with open("ci-evidence.json", "w", encoding="utf-8") as f:
              json.dump(evidence, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

          cat ci-evidence.json

      - name: Upload CI evidence
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-pr-${{ steps.identity.outputs.pr_number }}-${{ steps.identity.outputs.head_sha }}
          path: ci-evidence.json
          if-no-files-found: error
          retention-days: 30
