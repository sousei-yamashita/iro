name: Requirements Review Validator Probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_AW_MAX_DAILY_AI_CREDITS: ${{ vars.GH_AW_DEFAULT_MAX_DAILY_AI_CREDITS || '5000' }}
    steps:
      - id: setup
        uses: github/gh-aw-actions/setup@045beb2d14bda8d0c1f2e83b41527f63770d2855
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          safe-output-artifact-client: ${{ env.GH_AW_MAX_DAILY_AI_CREDITS != '' }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "Requirements Review"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/requirements-review-cost-test.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "1.0.83"
          GH_AW_INFO_AWF_VERSION: "v0.28.16"
          GH_AW_INFO_ENGINE_ID: "copilot"
