name: Jules API Conduction Test

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/jules-api-conduction.yml"

permissions:
  contents: read

jobs:
  conduction:
    name: Jules API conduction
    runs-on: ubuntu-latest
    env:
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
    steps:
      - name: Verify secret is present
        run: test -n "$JULES_API_KEY"

      - name: List all Jules sources and locate iro
        id: source
        shell: bash
        run: |
          set -euo pipefail
          : > all-sources.jsonl
          TOKEN=""
          for _ in {1..20}; do
            URL="https://jules.googleapis.com/v1alpha/sources?pageSize=100"
            if [ -n "$TOKEN" ]; then
              URL="$URL&pageToken=$(printf '%s' "$TOKEN" | jq -sRr @uri)"
            fi
            curl --fail-with-body --silent --show-error \
              -H "x-goog-api-key: $JULES_API_KEY" \
              "$URL" > page.json
            jq -c '.sources[]?' page.json >> all-sources.jsonl
            TOKEN="$(jq -r '.nextPageToken // empty' page.json)"
            [ -z "$TOKEN" ] && break
          done
          SOURCE="$(jq -sr '[.[] | select(.githubRepo.owner == "sousei-yamashita" and .githubRepo.repo == "iro")][0].name // empty' all-sources.jsonl)"
          if [ -z "$SOURCE" ]; then
            echo "::error::Jules API authentication succeeded, but sousei-yamashita/iro is not connected as a Jules Source."
            echo "Connected repositories visible to this Jules account:"
            jq -sr -r '.[] | "\(.githubRepo.owner)/\(.githubRepo.repo)"' all-sources.jsonl | sort
            exit 2
          fi
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "Jules source located for sousei-yamashita/iro"

      - name: Create non-mutating Jules session
        id: session
        shell: bash
        env:
          JULES_SOURCE: ${{ steps.source.outputs.source }}
        run: |
          set -euo pipefail
          jq -n \
            --arg source "$JULES_SOURCE" \
            '{
              prompt: "Sousei-line API conduction test only. Inspect the repository context and prepare a plan describing that the API connection works. Do not modify files, create commits, create pull requests, merge, deploy, approve, request changes, or make any adoption decision.",
              title: "Sousei-line Jules API conduction test",
              sourceContext: {
                source: $source,
                githubRepoContext: {startingBranch: "main"}
              },
              requirePlanApproval: true
            }' > request.json

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-goog-api-key: $JULES_API_KEY" \
            --data @request.json \
            "https://jules.googleapis.com/v1alpha/sessions" > session.json

          SESSION_ID="$(jq -r '.id // empty' session.json)"
          SESSION_NAME="$(jq -r '.name // empty' session.json)"
          test -n "$SESSION_ID"
          test -n "$SESSION_NAME"
          echo "Jules API conduction succeeded"
          echo "session_id=$SESSION_ID"
          echo "session_name=$SESSION_NAME"
          echo "requirePlanApproval=true; no automationMode; no PR creation requested"
