name: Jules Independent Verification Experiment

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/jules-api-conduction.yml"
      - ".github/jules-independent-trigger"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  independent-verification:
    name: Jules Independent Verification
    runs-on: ubuntu-latest
    env:
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Verify fixed subject
        shell: bash
        run: |
          set -euo pipefail
          test -n "$JULES_API_KEY"
          test -n "$PR_NUMBER"
          test -n "$SUBJECT_SHA"
          test "${#SUBJECT_SHA}" -eq 40

      - name: Locate iro Jules source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          : > all-sources.jsonl
          TOKEN=""
          for _ in {1..20}; do
            URL="https://jules.googleapis.com/v1alpha/sources?pageSize=100"
            if [ -n "$TOKEN" ]; then
              URL="$URL&pageToken=$(printf '%s' "$TOKEN" | jq -sRr @uri)"
            fi
            curl --fail-with-body --silent --show-error \
              -H "x-goog-api-key: $JULES_API_KEY" "$URL" > page.json
            jq -c '.sources[]?' page.json >> all-sources.jsonl
            TOKEN="$(jq -r '.nextPageToken // empty' page.json)"
            [ -z "$TOKEN" ] && break
          done
          SOURCE="$(jq -sr '[.[] | select(.githubRepo.owner == "sousei-yamashita" and .githubRepo.repo == "iro")][0].name // empty' all-sources.jsonl)"
          test -n "$SOURCE"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"

      - name: Create blind independent-verification session
        id: session
        shell: bash
        env:
          JULES_SOURCE: ${{ steps.source.outputs.source }}
        run: |
          set -euo pipefail
          PROMPT="$(cat <<'EOF'
          You are the independent verification executor for Sousei-line.

          Inspection subject:
          repository: __REPOSITORY__
          pull_request: #__PR_NUMBER__
          exact full head SHA: __SUBJECT_SHA__

          Independence requirement:
          - Independently inspect the repository and this exact PR/head.
          - Do NOT use, request, quote, or rely on any prior Requirements Review verdict, semantic-review evidence, human adoption decision, or prior independent verdict.
          - Gather the applicable requirements and evidence yourself from the repository and GitHub PR state available to you.
          - Verify the current PR head is exactly the SHA above. If it is not, return STALE.
          - Inspect the complete change and applicable repository requirements, including README.md, AGENTS.md, PRODUCT.md, DESIGN.md, QA.md, docs/REVIEW_HANDOFF.md, docs/REVIEW_EVIDENCE.md, and docs/SOUSEI_LINE_IDENTITY.md when present.
          - Check identity mismatch, stale evidence assumptions, scope drift, merge-boundary confusion, unsafe permissions, and concrete requirement mismatches.
          - Inspection only. Do not modify files, commit, create a PR, merge, deploy, approve, request changes, or make the human ADOPT/REJECT decision.

          Your final response MUST be exactly one JSON object and no Markdown:
          {"schema":"sousei.line-evidence/v1","repository":"__REPOSITORY__","pr_number":__PR_NUMBER__,"subject_head_sha":"__SUBJECT_SHA__","stage":"independent","verdict":"PASS or NG or STALE","evidence":{"findings":[]},"inspector":{"process":"independent-requirements-verification","process_version":"1","executor":"google-jules"},"issued_at":"<RFC3339 UTC>"}
          For NG, findings must identify concrete mismatches and their source requirement.
          EOF
          )"
          PROMPT="${PROMPT//__REPOSITORY__/$GITHUB_REPOSITORY}"
          PROMPT="${PROMPT//__PR_NUMBER__/$PR_NUMBER}"
          PROMPT="${PROMPT//__SUBJECT_SHA__/$SUBJECT_SHA}"
          jq -n \
            --arg prompt "$PROMPT" \
            --arg source "$JULES_SOURCE" \
            --arg branch "$HEAD_REF" \
            --arg title "Sousei-line independent verification PR #$PR_NUMBER $SUBJECT_SHA" \
            '{prompt:$prompt,title:$title,sourceContext:{source:$source,githubRepoContext:{startingBranch:$branch}},requirePlanApproval:false}' > request.json
          curl --fail-with-body --silent --show-error \
            -X POST -H "Content-Type: application/json" \
            -H "x-goog-api-key: $JULES_API_KEY" \
            --data @request.json \
            "https://jules.googleapis.com/v1alpha/sessions" > session.json
          SESSION_NAME="$(jq -r '.name // empty' session.json)"
          SESSION_ID="$(jq -r '.id // empty' session.json)"
          test -n "$SESSION_NAME"
          test -n "$SESSION_ID"
          echo "session_name=$SESSION_NAME" >> "$GITHUB_OUTPUT"
          echo "session_id=$SESSION_ID" >> "$GITHUB_OUTPUT"
          echo "Independent verification session created: $SESSION_NAME"
          echo "Subject: $GITHUB_REPOSITORY PR #$PR_NUMBER $SUBJECT_SHA"
          echo "Independent verification session started automatically; no mutation automation requested."


      - name: Wait for Jules result and validate evidence
        id: evidence
        shell: bash
        env:
          SESSION_ID: ${{ steps.session.outputs.session_id }}
        run: |
          set -euo pipefail
          for _ in {1..60}; do
            curl --fail-with-body --silent --show-error               -H "x-goog-api-key: $JULES_API_KEY"               "https://jules.googleapis.com/v1alpha/sessions/$SESSION_ID" > session-status.json
            STATE="$(jq -r '.state // empty' session-status.json)"
            echo "Jules state: $STATE"
            case "$STATE" in
              COMPLETED) break ;;
              FAILED) echo "Jules session failed"; exit 1 ;;
              AWAITING_PLAN_APPROVAL|AWAITING_USER_FEEDBACK|PAUSED)
                echo "Jules requires human interaction: $STATE"; exit 1 ;;
            esac
            sleep 10
          done
          test "$(jq -r '.state' session-status.json)" = "COMPLETED"

          curl --fail-with-body --silent --show-error             -H "x-goog-api-key: $JULES_API_KEY"             "https://jules.googleapis.com/v1alpha/sessions/$SESSION_ID/activities?pageSize=100" > activities.json

          jq -r '[.activities[]? | select(.agentMessaged.agentMessage? != null) | .agentMessaged.agentMessage] | last // empty' activities.json > evidence.json
          jq -e . evidence.json >/dev/null
          test "$(jq -r '.schema' evidence.json)" = "sousei.line-evidence/v1"
          test "$(jq -r '.repository' evidence.json)" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.pr_number|tostring' evidence.json)" = "$PR_NUMBER"
          test "$(jq -r '.subject_head_sha' evidence.json)" = "$SUBJECT_SHA"
          test "$(jq -r '.stage' evidence.json)" = "independent"
          jq -e '.verdict == "PASS" or .verdict == "NG" or .verdict == "STALE"' evidence.json >/dev/null
          {
            echo 'json<<EOF'
            cat evidence.json
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Recheck PR head before evidence return
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)"
          test "$CURRENT_SHA" = "$SUBJECT_SHA"

      - name: Return independent evidence to PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_JSON: ${{ steps.evidence.outputs.json }}
        run: |
          set -euo pipefail
          MARKER="SOUSEI_INDEPENDENT_EVIDENCE"
          EXISTING="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --paginate             --jq '.[] | select(.body | contains("'"$MARKER"'")) | select(.body | contains("'"$SUBJECT_SHA"'")) | .id' | head -n1)"
          if [ -n "$EXISTING" ]; then
            echo "Evidence already returned for this exact SHA: comment $EXISTING"
            exit 0
          fi
          BODY="$(printf '%s\n\n\`\`\`json\n%s\n\`\`\`' "$MARKER" "$EVIDENCE_JSON")"
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$BODY" >/dev/null
          echo "Independent evidence returned to PR #$PR_NUMBER for $SUBJECT_SHA"
