name: Jules Independent Verification Experiment

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/jules-api-conduction.yml"
      - ".github/jules-independent-trigger"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: jules-independent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  independent-verification:
    name: Jules Independent Verification
    runs-on: ubuntu-latest
    env:
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Verify fixed subject
        shell: bash
        run: |
          set -euo pipefail
          test -n "$JULES_API_KEY"
          test -n "$PR_NUMBER"
          test -n "$SUBJECT_SHA"
          test "${#SUBJECT_SHA}" -eq 40

      - name: Locate iro Jules source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          : > all-sources.jsonl
          TOKEN=""
          for _ in {1..20}; do
            URL="https://jules.googleapis.com/v1alpha/sources?pageSize=100"
            if [ -n "$TOKEN" ]; then
              URL="$URL&pageToken=$(printf '%s' "$TOKEN" | jq -sRr @uri)"
            fi
            curl --fail-with-body --silent --show-error \
              -H "x-goog-api-key: $JULES_API_KEY" "$URL" > page.json
            jq -c '.sources[]?' page.json >> all-sources.jsonl
            TOKEN="$(jq -r '.nextPageToken // empty' page.json)"
            [ -z "$TOKEN" ] && break
          done
          SOURCE="$(jq -sr '[.[] | select(.githubRepo.owner == "sousei-yamashita" and .githubRepo.repo == "iro")][0].name // empty' all-sources.jsonl)"
          test -n "$SOURCE"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"

      - name: Rehydrate existing Jules session with official SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/jules-sdk-diagnostic
          cd /tmp/jules-sdk-diagnostic
          npm init -y >/dev/null 2>&1
          npm install --silent @google/jules-sdk
          cat > diagnostic.mjs <<'EOF'
          import { jules } from '@google/jules-sdk';

          const session = jules.session('12079606609202268163');
          const info = await session.info();
          console.log('SDK session state:', info.state);

          let lastAgentMessage = '';
          let count = 0;
          for await (const activity of session.stream()) {
            count += 1;
            console.log('SDK activity:', activity.type);
            if (activity.type === 'agentMessaged') lastAgentMessage = activity.message ?? '';
          }
          console.log('SDK activity count:', count);
          console.log('SDK last agent message:', lastAgentMessage);
          const result = await session.result();
          console.log('SDK result state:', result.state);
          EOF
          node diagnostic.mjs

      - name: Recheck PR head before evidence return
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)"
          test "$CURRENT_SHA" = "$SUBJECT_SHA"

      - name: Return independent evidence to PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_JSON: ${{ steps.evidence.outputs.json }}
        run: |
          set -euo pipefail
          MARKER="SOUSEI_INDEPENDENT_EVIDENCE"
          EXISTING="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --paginate             --jq '.[] | select(.body | contains("'"$MARKER"'")) | select(.body | contains("'"$SUBJECT_SHA"'")) | .id' | head -n1)"
          if [ -n "$EXISTING" ]; then
            echo "Evidence already returned for this exact SHA: comment $EXISTING"
            exit 0
          fi
          BODY="$(printf '%s\n\n\`\`\`json\n%s\n\`\`\`' "$MARKER" "$EVIDENCE_JSON")"
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$BODY" >/dev/null
          echo "Independent evidence returned to PR #$PR_NUMBER for $SUBJECT_SHA"
