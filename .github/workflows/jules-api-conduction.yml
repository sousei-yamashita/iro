name: Jules Independent Verification Experiment

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/jules-api-conduction.yml"
      - ".github/jules-independent-trigger"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: jules-independent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  independent-verification:
    name: Jules Independent Verification
    runs-on: ubuntu-latest
    env:
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Verify fixed subject
        shell: bash
        run: |
          set -euo pipefail
          test -n "$JULES_API_KEY"
          test -n "$PR_NUMBER"
          test -n "$SUBJECT_SHA"
          test "${#SUBJECT_SHA}" -eq 40

      - name: Locate iro Jules source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          : > all-sources.jsonl
          TOKEN=""
          for _ in {1..20}; do
            URL="https://jules.googleapis.com/v1alpha/sources?pageSize=100"
            if [ -n "$TOKEN" ]; then
              URL="$URL&pageToken=$(printf '%s' "$TOKEN" | jq -sRr @uri)"
            fi
            curl --fail-with-body --silent --show-error \
              -H "x-goog-api-key: $JULES_API_KEY" "$URL" > page.json
            jq -c '.sources[]?' page.json >> all-sources.jsonl
            TOKEN="$(jq -r '.nextPageToken // empty' page.json)"
            [ -z "$TOKEN" ] && break
          done
          SOURCE="$(jq -sr '[.[] | select(.githubRepo.owner == "sousei-yamashita" and .githubRepo.repo == "iro")][0].name // empty' all-sources.jsonl)"
          test -n "$SOURCE"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"

      - name: Use existing completed Jules session for Activities diagnostic
        id: session
        shell: bash
        run: |
          set -euo pipefail
          # Diagnostic only: do not create a new Jules session.
          SESSION_NAME="sessions/12079606609202268163"
          SESSION_ID="12079606609202268163"
          echo "session_name=$SESSION_NAME" >> "$GITHUB_OUTPUT"
          echo "session_id=$SESSION_ID" >> "$GITHUB_OUTPUT"
          echo "Using existing Jules session only: $SESSION_NAME"

      - name: Wait for Jules evidence and validate
        id: evidence
        shell: bash
        env:
          SESSION_NAME: ${{ steps.session.outputs.session_name }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
        run: |
          set -euo pipefail
          test -n "$SESSION_NAME"
          test -n "$SESSION_ID"
          case "$SESSION_NAME" in sessions/*) ;; *) echo "Invalid Jules session resource name"; exit 1;; esac

          FOUND=0
          for _ in {1..180}; do
            curl --fail-with-body --silent --show-error \
              -H "x-goog-api-key: $JULES_API_KEY" \
              "https://jules.googleapis.com/v1alpha/$SESSION_NAME" > session-status.json
            STATE="$(jq -r '.state // empty' session-status.json)"
            echo "Jules state: $STATE"

            curl --fail-with-body --silent --show-error \
              -H "x-goog-api-key: $JULES_API_KEY" \
              "https://jules.googleapis.com/v1alpha/sessions/$SESSION_ID/activities?pageSize=100" > activities.json

            jq -r '[.activities[]? | select(.agentMessaged.agentMessage? != null) | .agentMessaged.agentMessage] | last // empty' activities.json > candidate.txt
            if jq -e . candidate.txt >/dev/null 2>&1 &&
               [ "$(jq -r '.schema // empty' candidate.txt)" = "sousei.line-evidence/v1" ]; then
              cp candidate.txt evidence.json
              FOUND=1
              break
            fi

            if jq -e '.activities[]? | select(.sessionFailed != null)' activities.json >/dev/null; then
              jq -r '.activities[]? | select(.sessionFailed != null) | .sessionFailed.reason' activities.json
              exit 1
            fi
            case "$STATE" in
              FAILED) echo "Jules session failed."; exit 1 ;;
              AWAITING_PLAN_APPROVAL) echo "Unexpected plan approval wait."; exit 1 ;;
              QUEUED|PLANNING|IN_PROGRESS|PAUSED|AWAITING_USER_FEEDBACK|COMPLETED|STATE_UNSPECIFIED|"") ;;
              *) echo "Unexpected Jules state: $STATE"; exit 1 ;;
            esac
            if [ "$STATE" = "COMPLETED" ]; then
              echo "Jules completed without a valid evidence message."
              exit 1
            fi
            sleep 10
          done
          test "$FOUND" -eq 1

          test "$(jq -r '.repository' evidence.json)" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.pr_number|tostring' evidence.json)" = "$PR_NUMBER"
          test "$(jq -r '.subject_head_sha' evidence.json)" = "$SUBJECT_SHA"
          test "$(jq -r '.stage' evidence.json)" = "independent"
          jq -e '.verdict == "PASS" or .verdict == "NG" or .verdict == "STALE"' evidence.json >/dev/null
          {
            echo 'json<<EOF'
            cat evidence.json
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Recheck PR head before evidence return
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)"
          test "$CURRENT_SHA" = "$SUBJECT_SHA"

      - name: Return independent evidence to PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_JSON: ${{ steps.evidence.outputs.json }}
        run: |
          set -euo pipefail
          MARKER="SOUSEI_INDEPENDENT_EVIDENCE"
          EXISTING="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --paginate             --jq '.[] | select(.body | contains("'"$MARKER"'")) | select(.body | contains("'"$SUBJECT_SHA"'")) | .id' | head -n1)"
          if [ -n "$EXISTING" ]; then
            echo "Evidence already returned for this exact SHA: comment $EXISTING"
            exit 0
          fi
          BODY="$(printf '%s\n\n\`\`\`json\n%s\n\`\`\`' "$MARKER" "$EVIDENCE_JSON")"
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$BODY" >/dev/null
          echo "Independent evidence returned to PR #$PR_NUMBER for $SUBJECT_SHA"
