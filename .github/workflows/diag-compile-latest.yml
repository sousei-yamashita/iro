name: Diagnostic compile latest gh-aw
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install gh-aw v0.89.15
        run: |
          curl -sSL https://raw.githubusercontent.com/github/gh-aw/main/install-gh-aw.sh -o /tmp/install-gh-aw.sh
          bash /tmp/install-gh-aw.sh v0.89.15
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Compile
        run: |
          gh aw compile requirements-review-cost-test --validate --verbose
          gh aw --version
      - name: Validate generated lock with actionlint
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -oneline -shellcheck= -pyflakes= .github/workflows/requirements-review-cost-test.lock.yml
