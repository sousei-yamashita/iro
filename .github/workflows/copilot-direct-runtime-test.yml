name: Copilot direct runtime test

on:
  push:
    branches:
      - test/codex-requirements-review-runtime
    paths:
      - ".github/workflows/copilot-direct-runtime-test.yml"

permissions:
  contents: read

jobs:
  runtime-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Run Codex through GitHub Copilot
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_MODEL: gpt-5.3-codex
          COPILOT_AUTO_UPDATE: "false"
        run: |
          copilot -sp "Return exactly: SOUSEI_CODEX_COPILOT_DIRECT_OK" --no-ask-user
