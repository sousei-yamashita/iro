name: Compile agentic workflow

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install gh-aw CLI
        uses: github/gh-aw/actions/setup-cli@main
        with:
          version: v0.88.7

      - name: Compile requirements review workflow
        run: gh aw compile requirements-review-cost-test

      - name: Verify compiled workflow and bounded cost
        shell: bash
        run: |
          set -euo pipefail
          file=".github/workflows/requirements-review-cost-test.lock.yml"
          test -s "$file"
          grep -n 'maxAiCredits' "$file"

      - name: Commit compiled lock to dedicated branch
        shell: bash
        run: |
          set -euo pipefail
          target_branch="generated/requirements-review-cost-test-lock"
          file=".github/workflows/requirements-review-cost-test.lock.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$target_branch"
          git add "$file"
          if git diff --cached --quiet; then
            echo "Compiled lock is unchanged"
            exit 0
          fi
          git commit -m "Compile requirements review workflow"
          git push --force-with-lease origin "$target_branch"

      - name: Upload compiled lock
        uses: actions/upload-artifact@v4
        with:
          name: requirements-review-cost-test-lock
          path: .github/workflows/requirements-review-cost-test.lock.yml
          if-no-files-found: error
          retention-days: 1
